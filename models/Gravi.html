<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Гравіювання — macbayparts</title>
<link rel="stylesheet" href="../style.css">
<style>
body{background:#f5f5f7;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111}
.gravi-page{max-width:1100px;margin:0 auto;padding:50px 18px 80px}
.gravi-card{background:#fff;border-radius:24px;padding:45px;display:grid;grid-template-columns:1fr 1fr;gap:45px;box-shadow:0 10px 35px rgba(0,0,0,.07);align-items:center}
.gravi-image{height:380px;border-radius:18px;background:#f2f2f4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gravi-image img{width:100%;height:100%;object-fit:cover}
.gravi-label{font-size:12px;letter-spacing:.12em;font-weight:700;color:#777}
h1{font-size:40px;line-height:1.1;margin:12px 0 18px}
.desc{font-size:17px;line-height:1.6;color:#555}
.price{font-size:30px;font-weight:800;margin:25px 0}
.add-btn{border:0;background:#111;color:#fff;padding:16px 25px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.add-btn:hover{background:#2b2b2b}
.back{display:inline-block;margin-bottom:20px;text-decoration:none;color:#111;font-weight:600}
.notice{margin-top:15px;color:#169957;font-size:14px;min-height:20px}
@media(max-width:750px){.gravi-card{grid-template-columns:1fr;padding:25px}.gravi-image{height:280px}h1{font-size:32px}}
</style>
</head>
<body>
<header class="header">
 <div class="header-left"><a href="../index.html" class="logo">macbay<span>parts</span></a></div>
 <div class="header-right"><a href="../cart.html" class="header-icon" style="text-decoration:none">🛒 <span>Кошик (<span id="cart-count">0</span>)</span></a></div>
</header>
<main class="gravi-page">
 <a class="back" href="../index.html">← Повернутися до каталогу</a>
 <section class="gravi-card">
  <div class="gravi-image">
   <img src="https://gravirovka.ua/wp-content/uploads/2023/02/gravirovka-keyboard.jpg" alt="Гравіювання на MacBook">
  </div>
  <div>
   <span class="gravi-label">MACBAYPARTS • ПОСЛУГА</span>
   <h1>Гравіювання</h1>
   <p class="desc">Індивідуальне гравіювання для MacBook. Вкажіть бажаний текст або символи в коментарі під час оформлення замовлення.</p>
   <div class="price">500 грн</div>
   <button class="add-btn" id="add-graving">Додати гравіювання в кошик</button>
   <div class="notice" id="notice"></div>
  </div>
 </section>
</main>
<script>
const KEY="userCart";
function cart(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function update(){document.getElementById("cart-count").textContent=cart().reduce((s,i)=>s+(Number(i.quantity)||1),0)}
document.getElementById("add-graving").onclick=()=>{
 const c=cart(); const existing=c.find(i=>i.id==="engraving-500");
 if(existing) existing.quantity=(Number(existing.quantity)||1)+1;
 else c.push({id:"engraving-500",name:"Гравіювання MacBook",price:"500 грн",quantity:1,image:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=85"});
 localStorage.setItem(KEY,JSON.stringify(c)); update();
 document.getElementById("notice").textContent="✓ Гравіювання додано в кошик.";
};
update();
</script>
</body>
</html>
